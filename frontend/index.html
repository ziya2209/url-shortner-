<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>fasturl.com — URL Shortener</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #111c36;
    --panel-2: #172444;
    --border: #23325a;
    --text: #e5edff;
    --muted: #8aa0c9;
    --accent: #6366f1;
    --accent-hover: #7c7ff4;
    --danger: #ef4444;
    --success: #10b981;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1000px 600px at 20% 0%, #1b2a57 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: 0.4px; }
  .brand span { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.ghost:hover { background: var(--panel-2); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  main {
    max-width: 720px;
    margin: 48px auto;
    padding: 0 20px;
  }
  h1 {
    font-size: 36px;
    margin: 0 0 8px;
    line-height: 1.15;
  }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
  }
  .tab.active { color: var(--text); border-color: var(--accent); background: rgba(99,102,241,0.12); }

  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  form .actions { margin-top: 18px; display: flex; gap: 10px; }

  .hidden { display: none !important; }

  .result {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    word-break: break-all;
  }
  .result a { color: var(--accent-hover); }

  .toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    max-width: 360px;
  }
  .toast.error { background: #2a1213; border: 1px solid var(--danger); color: #ffd7d7; }
  .toast.ok { background: #0f2a20; border: 1px solid var(--success); color: #c8ffe4; }

  .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
  <div class="nav">
    <div class="brand">fast<span>url.com</span></div>
    <div class="nav-right">
      <span id="who"></span>
      <button id="logoutBtn" class="btn ghost hidden">Log out</button>
    </div>
  </div>

  <main>
    <h1>Shorten links in seconds.</h1>
    <p class="sub">Sign up, log in, and turn long URLs into tidy short ones.</p>

    <div id="authCard" class="card">
      <div class="tabs">
        <div class="tab active" data-tab="login">Log in</div>
        <div class="tab" data-tab="signup">Sign up</div>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required />
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required />
        <div class="actions">
          <button class="btn" type="submit">Log in</button>
        </div>
      </form>

      <form id="signupForm" class="hidden">
        <label for="signupName">Name</label>
        <input id="signupName" type="text" autocomplete="name" required />
        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" autocomplete="email" required />
        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" autocomplete="new-password" required />
        <div class="actions">
          <button class="btn" type="submit">Create account</button>
        </div>
      </form>
    </div>

    <div id="shortenCard" class="card hidden">
      <form id="shortenForm">
        <label for="longUrl">Paste your long URL</label>
        <input id="longUrl" type="url" placeholder="https://example.com/very/long/path" required />
        <div class="actions">
          <button class="btn" type="submit">Shorten</button>
        </div>
      </form>
      <div id="shortenResult" class="result hidden"></div>
    </div>

    <div class="footer">Running on <code>localhost:8081</code></div>
  </main>

  <div id="toast" class="toast hidden"></div>

<script>
  const API = window.location.origin;
  const TOKEN_KEY = "shrnk.token";
  const NAME_KEY = "shrnk.name";

  const $ = (id) => document.getElementById(id);
  const tabs = document.querySelectorAll(".tab");
  const loginForm = $("loginForm");
  const signupForm = $("signupForm");
  const shortenForm = $("shortenForm");
  const shortenResult = $("shortenResult");
  const authCard = $("authCard");
  const shortenCard = $("shortenCard");
  const logoutBtn = $("logoutBtn");
  const who = $("who");
  const toast = $("toast");

  function showToast(msg, kind = "ok") {
    toast.textContent = msg;
    toast.className = "toast " + kind;
    setTimeout(() => toast.classList.add("hidden"), 10);
    toast.classList.remove("hidden");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.add("hidden"), 3500);
  }

  function setAuthed(token, name) {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    if (name) localStorage.setItem(NAME_KEY, name);
    renderAuthState();
  }

  function clearAuth() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(NAME_KEY);
    renderAuthState();
  }

  function renderAuthState() {
    const token = localStorage.getItem(TOKEN_KEY);
    const name = localStorage.getItem(NAME_KEY);
    if (token) {
      authCard.classList.add("hidden");
      shortenCard.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      who.textContent = name ? `Signed in as ${name}` : "Signed in";
    } else {
      authCard.classList.remove("hidden");
      shortenCard.classList.add("hidden");
      logoutBtn.classList.add("hidden");
      who.textContent = "";
      shortenResult.classList.add("hidden");
      shortenResult.textContent = "";
    }
  }

  async function api(path, { method = "GET", body, auth = false } = {}) {
    const headers = { "Content-Type": "application/json" };
    if (auth) {
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) headers["Authorization"] = "Bearer " + token;
    }
    const res = await fetch(API + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const message = data.error || data.msg || `Request failed (${res.status})`;
      throw new Error(typeof message === "string" ? message : JSON.stringify(message));
    }
    return data;
  }

  tabs.forEach((t) => {
    t.addEventListener("click", () => {
      tabs.forEach((x) => x.classList.remove("active"));
      t.classList.add("active");
      const which = t.dataset.tab;
      loginForm.classList.toggle("hidden", which !== "login");
      signupForm.classList.toggle("hidden", which !== "signup");
    });
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;
    try {
      const data = await api("/login", { method: "POST", body: { email, password } });
      setAuthed(data.token, email.split("@")[0]);
      showToast("Welcome back!", "ok");
      loginForm.reset();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("signupName").value.trim();
    const email = $("signupEmail").value.trim();
    const password = $("signupPassword").value;
    try {
      await api("/account", { method: "POST", body: { name, email, password } });
      showToast("Account created — logging you in.", "ok");
      const data = await api("/login", { method: "POST", body: { email, password } });
      setAuthed(data.token, name);
      signupForm.reset();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  shortenForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const longUrl = $("longUrl").value.trim();
    try {
      const data = await api("/getshorturl", {
        method: "POST",
        body: { long_url: longUrl },
        auth: true,
      });
      const shortUrl = `${API}/${data.id}`;
      shortenResult.classList.remove("hidden");
      shortenResult.innerHTML =
        `<div style="color: var(--muted); font-size:12px; margin-bottom:6px;">Your short link</div>` +
        `<a href="${shortUrl}" target="_blank" rel="noopener">${shortUrl}</a>`;
      shortenForm.reset();
    } catch (err) {
      if (/unauthorized|expired|invalid token/i.test(err.message)) {
        clearAuth();
        showToast("Session expired. Please log in.", "error");
      } else {
        showToast(err.message, "error");
      }
    }
  });

  logoutBtn.addEventListener("click", () => {
    clearAuth();
    showToast("Logged out.", "ok");
  });

  renderAuthState();
</script>
</body>
</html>
